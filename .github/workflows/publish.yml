name: Publish Mantine React Table

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm package version, for example 0.1.0
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mantine-react-table
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: TanStack/table
  UPSTREAM_REF: beta
  UPSTREAM_PATH: examples/react/mantine-react-table
  PACKAGE_NAME: '@hillac/mantine-react-table'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out publisher repository
        uses: actions/checkout@v4

      - name: Check out TanStack Table
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/react/mantine-react-table/src/mantine-react-table
            examples/react/mantine-react-table/package.json
            LICENSE

      - name: Patch Mantine React Table loading state
        run: git -C upstream apply ../patches/include-loading-state.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Read upstream revision
        id: upstream
        working-directory: upstream
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' <<< "$REQUESTED_VERSION"; then
            echo "::error::Invalid semantic version: $REQUESTED_VERSION"
            exit 1
          fi

          echo "PACKAGE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"

      - name: Check whether version already exists
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
            --registry=https://registry.npmjs.org \
            >/dev/null 2>&1
          then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm."
            exit 1
          fi

      - name: Prepare package source and configuration
        run: ./scripts/prepare-source.sh

      - name: Generate package metadata and documentation
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: ./scripts/generate-package-metadata.sh

      - name: Install dependencies
        working-directory: generated
        run: npm install --ignore-scripts

      - name: Type-check
        working-directory: generated
        run: npm run typecheck

      - name: Build
        working-directory: generated
        run: npm run build

      - name: Validate package
        working-directory: generated
        run: ../scripts/validate-package.sh

      - name: Publish to npm
        working-directory: generated
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm publish
          --access public
          --tag "${{ inputs.npm_tag }}"
          --provenance
