name: Publish Mantine React Table

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm package version, for example 1.1.0
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - beta
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mantine-react-table
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@hillac/mantine-react-table'
  PNPM_VERSION: 12.6.0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out package source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' <<< "$REQUESTED_VERSION"; then
            echo "::error::Invalid semantic version: $REQUESTED_VERSION"
            exit 1
          fi
          echo "PACKAGE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"

      - name: Check whether version already exists
        run: |
          if pnpm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Set package version
        run: pnpm version "${PACKAGE_VERSION}" --no-git-tag-version

      - name: Validate source, package, demo, and browser tests
        run: pnpm run validate

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm publish
          --access public
          --tag "${{ inputs.npm_tag }}"
          --provenance
          --no-git-checks
